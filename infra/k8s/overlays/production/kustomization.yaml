apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: havyn-production

resources:
  - ../../base

# CI sets these to an explicitly *promoted* tag (see .github/workflows/deploy.yml —
# the image that already passed staging + smoke tests, never a fresh build) —
# "immutable images promoted across envs" per this prompt's own constraint.
images:
  - name: ghcr.io/OWNER/havyn-villa-api
    newTag: production-latest

# Base's replicas (2) and HPA range (2-6) already match production sizing — no
# override needed here, unlike staging's deliberately smaller footprint.

patches:
  - target:
      kind: Ingress
      name: havyn-villa
    patch: |
      - op: replace
        path: /spec/tls/0/hosts
        value: ["api.CHANGEME.example.com"]
      - op: replace
        path: /spec/rules/0/host
        value: api.CHANGEME.example.com
  - target:
      kind: ConfigMap
      name: havyn-api-config
    patch: |
      - op: add
        path: /data/WEB_BASE_URL
        value: https://CHANGEME.example.com
  - target:
      kind: Deployment
      name: havyn-api
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 500m, memory: 1Gi }
          limits: { cpu: "2", memory: 2Gi }
