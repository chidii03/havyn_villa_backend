apiVersion: apps/v1
kind: Deployment
metadata:
  name: havyn-web
  labels:
    app: havyn-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: havyn-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: havyn-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: havyn-web
          image: ghcr.io/OWNER/havyn-villa-web:REPLACED_BY_CI # see README.md — no real registry/org exists yet
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # Next.js's standalone server has no dedicated readiness/liveness split
          # (unlike the API's Actuator probes) — a 200 on `/` is what's actually
          # checkable; matches this image's own Dockerfile HEALTHCHECK.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # No envFrom/ConfigMap — this tier has nothing runtime-configurable
          # today. NEXT_PUBLIC_* values are baked into the image at build time
          # (see apps/web/Dockerfile's build args), and the web tier calls only
          # the public backend API — it holds no secrets of its own.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
