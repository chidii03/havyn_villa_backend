# Generic nginx-ingress-controller annotations (the most widely available ingress
# controller across managed K8s providers) — swap for your controller/CNI of choice
# per architecture/01-system-architecture.md#8's "everything provider-swappable."
# host is a placeholder — see the staging/production overlays for real values.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: havyn-villa
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts: ["CHANGEME.example.com", "api.CHANGEME.example.com"]
      secretName: havyn-villa-tls
  rules:
    - host: api.CHANGEME.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: havyn-api
                port:
                  name: http
