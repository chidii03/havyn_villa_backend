apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - backend-deployment.yaml
  - backend-service.yaml
  - backend-hpa.yaml
  - backend-configmap.yaml
  - web-deployment.yaml
  - web-service.yaml
  - web-hpa.yaml
  - ingress.yaml

# backend-secret.example.yaml is deliberately NOT listed here — it's a template for
# humans/secret-management tooling, never applied via kustomize (see its own header
# comment). havyn-api-secrets is expected to already exist in each target namespace,
# created out-of-band.

commonLabels:
  app.kubernetes.io/part-of: havyn-villa
