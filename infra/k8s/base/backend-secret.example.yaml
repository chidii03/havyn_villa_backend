# TEMPLATE ONLY — documents the keys havyn-api-secrets must have; contains no real
# values (all "changeme..." placeholders). Never apply this file as-is and never
# commit a real filled-in version — same discipline as .env.example at the repo
# root. Real secrets are created out-of-band via your secrets manager (e.g.
# `kubectl create secret generic havyn-api-secrets --from-literal=...`, or your
# cluster's External Secrets Operator / Sealed Secrets / cloud-provider equivalent
# syncing from AWS Secrets Manager / GCP Secret Manager / Vault / etc. — provider
# left open per architecture/01-system-architecture.md#8, "everything
# provider-swappable").
apiVersion: v1
kind: Secret
metadata:
  name: havyn-api-secrets
type: Opaque
stringData:
  POSTGRES_HOST: changeme-managed-postgres-host
  POSTGRES_USER: changeme
  POSTGRES_PASSWORD: changeme
  REDIS_HOST: changeme-managed-redis-host
  MAIL_HOST: changeme-transactional-mail-host
  MAIL_API_KEY: changeme
  WEB_BASE_URL: https://changeme.example.com
  JWT_ACCESS_SECRET: changeme-min-32-bytes-high-entropy
  JWT_REFRESH_SECRET: changeme-min-32-bytes-high-entropy-different-from-access
  CLOUDINARY_CLOUD_NAME: changeme
  CLOUDINARY_API_KEY: changeme
  CLOUDINARY_API_SECRET: changeme
  GOOGLE_MAPS_SERVER_KEY: changeme
  PAYSTACK_SECRET_KEY: changeme
  PAYSTACK_CALLBACK_URL: https://changeme.example.com/trips
