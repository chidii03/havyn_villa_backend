name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1" # weekly, catches newly-published CodeQL query findings even with no code changes

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build Java for CodeQL
        run: ./gradlew --no-daemon classes

      - name: Perform CodeQL analysis (Java)
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java-kotlin"
          upload: ${{ github.event_name != 'pull_request' }}
