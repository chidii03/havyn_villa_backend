name: Backend Kubernetes learning deploy

# Manual Kubernetes practice path only. The standalone web and mobile apps are
# not built here. Railway is the production deployment for the backend.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}-api

jobs:
  build-and-push:
    name: Build and push API image
    runs-on: ubuntu-latest
    outputs:
      api-tag: ${{ steps.tags.outputs.api-tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tags
        run: echo "api-tag=${{ env.API_IMAGE }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ${{ steps.tags.outputs.api-tag }}
            ${{ env.API_IMAGE }}:learning-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-learning:
    name: Deploy API to optional Kubernetes cluster
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
      - name: Check cluster access
        id: gate
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG_STAGING }}" ]; then
            echo "KUBE_CONFIG_STAGING is not configured; image publishing completed and Kubernetes deployment is skipped."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.configured == 'true'
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > "$HOME/.kube/config"
      - if: steps.gate.outputs.configured == 'true'
        uses: azure/setup-kubectl@v4
      - if: steps.gate.outputs.configured == 'true'
        working-directory: infra/k8s/overlays/staging
        run: |
          curl -sfL https://github.com/kubernetes-sigs/kustomize/releases/latest/download/kustomize_linux_amd64.tar.gz | tar xz
          ./kustomize edit set image ${{ env.API_IMAGE }}=${{ needs.build-and-push.outputs.api-tag }}
          ./kustomize build . | kubectl apply -f -
      - if: steps.gate.outputs.configured == 'true'
        run: kubectl -n havyn-staging rollout status deployment/havyn-api --timeout=5m
