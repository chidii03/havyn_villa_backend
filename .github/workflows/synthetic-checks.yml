name: Synthetic checks

# devops/02-observability.md: "synthetic checks on core flows (search, quote) in
# staging/prod." Scheduled every 15 minutes, but genuinely no-ops (exit 0,
# logs why) until the SYNTHETIC_BASE_URL repository variable is set — there is no
# staging/prod deployment yet (prompts 27/29). This is real, ready-to-use tooling,
# not a placeholder: set the variable once a real environment exists and this starts
# actually checking it, no code change needed.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - working-directory: infra/observability
        run: |
          npm install
          node synthetic-checks.mjs
        env:
          SYNTHETIC_BASE_URL: ${{ vars.SYNTHETIC_BASE_URL }}
