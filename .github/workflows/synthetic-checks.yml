name: Synthetic checks

on:
  schedule:
    - cron: "*/15 * * * *"   
  workflow_dispatch: {}

jobs:
  synthetic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - working-directory: infra/observability
        run: |
          npm install
          node synthetic-checks.mjs
        env:
          SYNTHETIC_BASE_URL: ${{ vars.SYNTHETIC_BASE_URL }}
