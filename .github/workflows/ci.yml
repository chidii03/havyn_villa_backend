name: Backend CI

on:
  pull_request:
  push:
    branches: ["**"]

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline-validation:
    name: Pipeline validation — observability, k8s manifests, workflow config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate observability configuration
        working-directory: infra/observability
        run: |
          npm ci
          node validate.mjs
      - name: Validate Kubernetes manifests
        working-directory: infra/k8s
        run: |
          npm ci
          node validate.mjs
      - name: Validate workflow configuration
        working-directory: infra/github
        run: |
          npm ci
          node validate.mjs

  backend:
    name: Backend — build, unit tests, coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Test and verify coverage
        working-directory: apps/api
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: apps/api/build/reports/tests/test
          retention-days: 14
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: apps/api/build/reports/jacoco/test/html
          retention-days: 14

  docker:
    name: Docker — API lint and image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint API Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: apps/api/Dockerfile
      - name: Build API image
        run: docker build -t havyn-api:ci apps/api
