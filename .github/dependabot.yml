version: 2

updates:
  - package-ecosystem: npm
    directory: "/" 
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 10

  - package-ecosystem: gradle
    directory: "/apps/api"
    schedule:
      interval: weekly
    groups:
      gradle-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
